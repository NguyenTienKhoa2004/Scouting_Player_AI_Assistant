name: pitchpulse

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PITCHPULSE_POSTGRES_DB:-pitchpulse}
      POSTGRES_USER: ${PITCHPULSE_POSTGRES_USER:-pitchpulse}
      POSTGRES_PASSWORD: ${PITCHPULSE_POSTGRES_PASSWORD:-1234567}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${PITCHPULSE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.17
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PITCHPULSE_PGADMIN_EMAIL:-admin@pitchpulse.com}
      PGADMIN_DEFAULT_PASSWORD: ${PITCHPULSE_PGADMIN_PASSWORD:-admin123}
    ports:
      - "${PITCHPULSE_PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
