name: matchmind

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MATCHMIND_POSTGRES_DB:-matchmind}
      POSTGRES_USER: ${MATCHMIND_POSTGRES_USER:-matchmind}
      POSTGRES_PASSWORD: ${MATCHMIND_POSTGRES_PASSWORD:-1234567}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${MATCHMIND_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.17
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${MATCHMIND_PGADMIN_EMAIL:-admin@matchmind.com}
      PGADMIN_DEFAULT_PASSWORD: ${MATCHMIND_PGADMIN_PASSWORD:-admin123}
    ports:
      - "${MATCHMIND_PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
