[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchpulse"
version = "0.1.0"
description = "Reusable data, football analytics, and ML logic for PitchPulse."
requires-python = ">=3.12"
dependencies = [
    "multimethod<2",
    "psycopg[binary]==3.3.4",
    "pyarrow==25.0.1",
    "scikit-learn==1.9.1",
    "socceraction==1.5.3",
    "xgboost==3.4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pitchpulse*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pitchpulse"]
